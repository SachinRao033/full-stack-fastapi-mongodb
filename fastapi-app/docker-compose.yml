services:

  # ============================================================
  # TRAEFIK REVERSE PROXY
  # ============================================================
  proxy:
    image: traefik:v2.11

    command:
      - --providers.docker.swarmmode=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --api.dashboard=true

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - traefik-public
      - default

    labels:
      - "traefik.enable=true"

      # Traefik dashboard
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=http"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"


  # ============================================================
  # RABBITMQ
  # ============================================================
  queue:
    image: rabbitmq:3

    volumes:
      - ./conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

    networks:
      - default


  # ============================================================
  # FLOWER
  # ============================================================
  flower:
    image: mher/flower:2.0.1

    env_file:
      - .env

    command:
      - celery
      - flower
      - "--broker=amqp://guest@queue:5672//"

    networks:
      - default
      - traefik-public

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.rule=Host(`flower.${DOMAIN}`)"
      - "traefik.http.routers.flower.entrypoints=http"
      - "traefik.http.services.flower.loadbalancer.server.port=5555"


  # ============================================================
  # FASTAPI BACKEND
  # ============================================================
  backend:
    image: "${DOCKER_IMAGE_BACKEND:-fastapi-backend}:latest"

    build:
      context: ./backend
      dockerfile: backend.dockerfile

      args:
        BACKEND_APP_MODULE: ${BACKEND_APP_MODULE:-app.main:app}
        BACKEND_PRE_START_PATH: ${BACKEND_PRE_START_PATH:-/app/prestart.sh}
        BACKEND_PROCESS_MANAGER: ${BACKEND_PROCESS_MANAGER:-gunicorn}
        BACKEND_WITH_RELOAD: ${BACKEND_WITH_RELOAD:-false}
        INSTALL_DEV: ${INSTALL_DEV:-false}

    env_file:
      - .env

    environment:
      SERVER_NAME: "13.234.162.115"
      SERVER_HOST: "http://13.234.162.115"
      SMTP_HOST: "${SMTP_HOST}"

    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "3"

    networks:
      - default

    labels:
      - "traefik.enable=true"

      # FastAPI API
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`))"
      - "traefik.http.routers.backend.entrypoints=http"
      - "traefik.http.services.backend.loadbalancer.server.port=80"


  # ============================================================
  # CELERY WORKER
  # ============================================================
  celeryworker:
    image: "${DOCKER_IMAGE_CELERYWORKER:-fastapi-celeryworker}:latest"

    build:
      context: ./backend
      dockerfile: celeryworker.dockerfile

      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}

    env_file:
      - .env

    environment:
      SERVER_NAME: "13.234.162.115"
      SERVER_HOST: "http://13.234.162.115"
      SMTP_HOST: "${SMTP_HOST}"

    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "3"

    networks:
      - default


  # ============================================================
  # NEXT.JS FRONTEND
  # ============================================================
  frontend:
    image: "${DOCKER_IMAGE_FRONTEND:-fastapi-frontend}:latest"

    build:
      context: ./frontend

    env_file:
      - .env
      - ./frontend/.env.local

    networks:
      - default

    labels:
      - "traefik.enable=true"

      # Frontend
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"


  # ============================================================
  # MONGODB
  # ============================================================
  mongodb:
    image: mongo:7

    restart: unless-stopped

    volumes:
      - app-mongodb-data:/data/db

    networks:
      - default


# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  app-mongodb-data:


# ==============================================================
# NETWORKS
# ==============================================================

networks:
  traefik-public:
    external: true
    name: traefik-public
