name: Deploy FastAPI MongoDB App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Secrets

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            cd "${{ secrets.APP_PATH }}"

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Checking Docker Swarm..."
            docker info --format 'Swarm: {{.Swarm.LocalNodeState}}'

            echo "Checking required files..."
            test -f .env
            test -f docker-compose.yml
            test -f conf/rabbitmq.conf

            echo "Validating Compose..."
            docker compose -f docker-compose.yml config > /dev/null

            echo "Building backend..."
            docker compose -f docker-compose.yml build backend

            echo "Building celeryworker..."
            docker compose -f docker-compose.yml build celeryworker

            echo "Building frontend..."
            docker compose -f docker-compose.yml build frontend

            echo "Deploying Docker Stack..."
            docker stack deploy \
              -c docker-compose.yml \
              example-com

            echo "Waiting for services..."
            sleep 20

            echo "======================================"
            echo "STACK SERVICES"
            echo "======================================"

            docker stack services example-com

            echo "======================================"
            echo "SERVICE STATUS"
            echo "======================================"

            docker service ps example-com_proxy
            docker service ps example-com_backend
            docker service ps example-com_celeryworker
            docker service ps example-com_frontend
            docker service ps example-com_mongodb
            docker service ps example-com_queue
            docker service ps example-com_flower

            echo "======================================"
            echo "RUNNING CONTAINERS"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

          EOF
