name: Deploy FastAPI Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << EOF

            set -e

            echo "================================="
            echo "Starting Deployment"
            echo "================================="

            cd "${{ secrets.APP_PATH }}"

            echo "Pulling latest code..."
            git pull origin main

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Checking environment file..."
            test -f .env

            echo "Validating Docker Compose..."
            docker compose -f docker-compose.yml config

            echo "Building application images..."
            docker compose build backend celeryworker frontend

            echo "Loading environment variables..."
            set -a
            source .env
            set +a

            echo "Validating Docker Swarm configuration..."
            docker stack config \
              -c docker-compose.yml \
              > /tmp/example-stack.yml

            echo "Deploying Docker Stack..."
            docker stack deploy \
              -c docker-compose.yml \
              example-com

            echo "Waiting for services..."
            sleep 20

            echo "================================="
            echo "Docker Stack Services"
            echo "================================="

            docker stack services example-com

            echo "================================="
            echo "Running Containers"
            echo "================================="

            docker ps

            echo "================================="
            echo "Deployment Completed"
            echo "================================="

          EOF

      - name: Application Health Check
        run: |
          sleep 10

          curl -f \
            "http://${{ secrets.EC2_HOST }}/api/v1/openapi.json"

          echo "Application health check passed!"
