name: Deploy FastAPI Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2

    # CHANGE THIS TO YOUR ACTUAL ENVIRONMENT NAME
    environment: Secrets

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 3. Deploy application
      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            echo "======================================"
            echo "Starting Deployment"
            echo "======================================"

            cd "${{ secrets.APP_PATH }}"

            echo "Pulling latest code..."
            git pull origin main

            echo "Checking Docker..."
            docker --version
            docker compose version

            echo "Checking Docker Swarm..."
            docker info | grep -i swarm

            echo "Checking environment file..."
            test -f .env

            echo "Checking RabbitMQ configuration..."
            test -f conf/rabbitmq.conf

            echo "Validating Docker Compose..."
            docker compose -f docker-compose.yml config

            echo "Building application images..."
            docker compose build backend celeryworker frontend

            echo "Loading environment..."
            set -a
            source .env
            set +a

            echo "Validating Docker Swarm configuration..."
            docker stack config \
              -c docker-compose.yml \
              > /tmp/example-stack.yml

            echo "Deploying Docker Swarm stack..."
            docker stack deploy \
              -c docker-compose.yml \
              example-com

            echo "Waiting for services..."
            sleep 20

            echo "======================================"
            echo "Docker Stack Services"
            echo "======================================"

            docker stack services example-com

            echo "======================================"
            echo "Deployment Completed"
            echo "======================================"

          EOF

      # 4. Verify deployment
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            set -e

            echo "======================================"
            echo "Service Status"
            echo "======================================"

            docker stack services example-com

            echo "======================================"
            echo "Running Containers"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "Swarm Status"
            echo "======================================"

            docker info | grep -i swarm

            echo "======================================"
            echo "Deployment Verification Completed"
            echo "======================================"

          EOF
